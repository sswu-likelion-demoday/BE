services:
  mysql:
    image: mysql:8.4
    container_name: sujeongring-mysql
    restart: unless-stopped

    ports:
      - "3309:3306"

    environment:
      MYSQL_DATABASE: sujeongring
      MYSQL_USER: sujeongring
      MYSQL_PASSWORD: sujeongring1234
      MYSQL_ROOT_PASSWORD: root1234
      TZ: Asia/Seoul

    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci

    volumes:
      - sujeongring-mysql-data:/var/lib/mysql

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  sujeongring-mysql-data: