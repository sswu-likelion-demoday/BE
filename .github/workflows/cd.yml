name: CD

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 프로젝트 소스 전체를 EC2 ~/sujeongring 으로 전송
      - name: Copy source to EC2
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ubuntu
          key: ${{ secrets.SSH_KEY }}
          source: "Dockerfile,.dockerignore,build.gradle,settings.gradle,gradlew,gradle,src"
          target: "/home/ubuntu/sujeongring"

      # EC2에서 Docker build + 실행
      - name: Deploy
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ubuntu
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd /home/ubuntu/sujeongring
            chmod +x gradlew
            docker compose up -d --build
            docker image prune -f
            docker compose ps